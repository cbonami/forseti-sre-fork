# grafana/otel-lgtm (Grafana + Prometheus + Loki + Tempo + Pyroscope + OTel
# Collector in one container) with a Thanos sidecar sharing its TSDB.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lgtm-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
# Prometheus (inside the lgtm container) uses this SA for Kubernetes node
# discovery and the cAdvisor scrape through the API server proxy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lgtm-prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lgtm-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lgtm-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lgtm-prometheus
subjects:
  - kind: ServiceAccount
    name: lgtm-prometheus
    namespace: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  labels:
    app.kubernetes.io/name: lgtm
spec:
  replicas: 1
  # RWO volume + single TSDB writer: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lgtm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lgtm
    spec:
      serviceAccountName: lgtm-prometheus
      terminationGracePeriodSeconds: 30
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.40.0
          env:
            # Thanos sidecar requires local compaction off: min = max = 2h.
            # --web.enable-lifecycle lets the sidecar's reloader POST /-/reload.
            # external-url makes alert generatorURLs clickable from the host.
            - name: PROMETHEUS_EXTRA_ARGS
              value: >-
                --storage.tsdb.min-block-duration=2h
                --storage.tsdb.max-block-duration=2h
                --storage.tsdb.retention.time=7d
                --web.enable-lifecycle
                --web.external-url=http://localhost:19090
            # Upstream defaults to anonymous *Admin*; turn that off so the
            # agent's Grafana access is exercised with real credentials/tokens.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: http://localhost:13000
          ports:
            - {name: grafana, containerPort: 3000}
            - {name: loki, containerPort: 3100}
            - {name: tempo, containerPort: 3200}
            - {name: pyroscope, containerPort: 4040}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: prometheus, containerPort: 9090}
          readinessProbe:
            exec:
              command: [/otel-lgtm/docker/healthcheck.sh]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 3
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 4Gi}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: prometheus-config
              mountPath: /otel-lgtm/prometheus.yaml
              subPath: prometheus.yaml
            - name: prometheus-rules
              mountPath: /etc/prometheus/rules
        - name: thanos-sidecar
          image: quay.io/thanos/thanos:v0.42.5
          args:
            - sidecar
            - --log.level=info
            - --tsdb.path=/data/prometheus
            - --prometheus.url=http://127.0.0.1:9090
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:10902
            # No --objstore.config: blocks stay local (StoreAPI over the live
            # TSDB only). Add an objstore + store gateway to test long-term reads.
            - --reloader.rule-dir=/etc/prometheus/rules
            - --reloader.watch-interval=30s
          ports:
            - {name: grpc, containerPort: 10901}
            - {name: http, containerPort: 10902}
          readinessProbe:
            httpGet: {path: /-/ready, port: 10902}
            periodSeconds: 10
          securityContext:
            runAsUser: 0
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: prometheus-rules
              mountPath: /etc/prometheus/rules
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lgtm-data
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-rules
          configMap:
            name: prometheus-rules
---
# In-cluster endpoints (native ports).
apiVersion: v1
kind: Service
metadata:
  name: lgtm
spec:
  selector:
    app.kubernetes.io/name: lgtm
  ports:
    - {name: grafana, port: 3000, targetPort: grafana}
    - {name: loki, port: 3100, targetPort: loki}
    - {name: tempo, port: 3200, targetPort: tempo}
    - {name: pyroscope, port: 4040, targetPort: pyroscope}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: prometheus, port: 9090, targetPort: prometheus}
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-sidecar
spec:
  selector:
    app.kubernetes.io/name: lgtm
  ports:
    - {name: grpc, port: 10901, targetPort: grpc}
    - {name: http, port: 10902, targetPort: http}
