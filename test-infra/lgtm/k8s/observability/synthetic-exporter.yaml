# Synthetic "noisy" exporter: python stdlib only, script from a ConfigMap,
# no image build and no pip. See files/synthetic_exporter.py.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-exporter
  labels:
    app.kubernetes.io/name: synthetic-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synthetic-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synthetic-exporter
    spec:
      containers:
        - name: exporter
          image: python:3.13.9-slim
          command: [python3, -u, /app/synthetic_exporter.py]
          env:
            - {name: PORT, value: "9100"}
            - {name: N_USERS, value: "20"}
            - {name: PER_USER_CYCLE_SECONDS, value: "1800"}
            - {name: PER_USER_ON_SECONDS, value: "900"}
            - {name: FLAP_PERIOD_SECONDS, value: "240"}
          ports:
            - {name: metrics, containerPort: 9100}
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 96Mi}
          securityContext:
            runAsUser: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: app, mountPath: /app}
      volumes:
        - name: app
          configMap:
            name: synthetic-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: synthetic-exporter
spec:
  selector:
    app.kubernetes.io/name: synthetic-exporter
  ports:
    - {name: metrics, port: 9100, targetPort: metrics}
