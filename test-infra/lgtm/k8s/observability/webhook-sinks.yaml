        app.kubernetes.io/name: sink-scom-legacy
    spec:
      containers:
        - name: sink
          image: python:3.13.9-slim
          command: [python3, -u, /app/webhook_sink.py]
          env:
            - {name: SINK_NAME, value: scom-legacy}
            - {name: PORT, value: "8080"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 96Mi}
          securityContext:
            runAsUser: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: app, mountPath: /app}
      volumes:
        - name: app
          configMap:
            name: synthetic-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: sink-scom-legacy
spec:
  selector:
    app.kubernetes.io/name: sink-scom-legacy
  ports:
    - {name: http, port: 8080, targetPort: http}
