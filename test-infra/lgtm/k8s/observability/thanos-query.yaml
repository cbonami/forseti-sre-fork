# Thanos Query: Prometheus-compatible HTTP API (/api/v1/query, query_range,
# series, labels, rules, alerts) over the sidecar's StoreAPI, like a production Thanos setup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-query
  labels:
    app.kubernetes.io/name: thanos-query
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-query
    spec:
      containers:
        - name: thanos-query
          image: quay.io/thanos/thanos:v0.42.5
          args:
            - query
            - --log.level=info
            - --http-address=0.0.0.0:10902
            - --grpc-address=0.0.0.0:10901
            - --endpoint.sd-config-file=/etc/thanos/endpoints.yaml
            - --endpoint.sd-config-reload-interval=30s
            # Single Prometheus, but keep the production-style dedup label wired.
            - --query.replica-label=replica
            - --web.external-prefix=
          ports:
            - {name: http, containerPort: 10902}
            - {name: grpc, containerPort: 10901}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: endpoints
              mountPath: /etc/thanos
      volumes:
        - name: endpoints
          configMap:
            name: thanos-endpoints
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-query
spec:
  selector:
    app.kubernetes.io/name: thanos-query
  ports:
    - {name: http, port: 10902, targetPort: http}
    - {name: grpc, port: 10901, targetPort: grpc}
